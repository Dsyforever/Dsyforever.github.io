name: Get Citation Data

on: 
 page_build: 
 schedule:
  - cron:  '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Reqs
      run: |
        sudo apt-get install python3-setuptools
    - name: Validate Required Secret
      if: ${{ env.GOOGLE_SCHOLAR_ID == '' }}
      run: |
        echo "GOOGLE_SCHOLAR_ID is not configured. Skipping citation update."
        exit 0
      env:
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
    - name: Run
      if: ${{ env.GOOGLE_SCHOLAR_ID != '' }}
      run: |
        cd ./google_scholar_crawler
        pip3 install -r requirements.txt
        python3 main.py
        cd ./results
        git init
        git config --local user.name "${GITHUB_ACTOR}"
        export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
        git add *.json
        if git diff --cached --quiet; then
          echo "No citation changes detected. Skipping commit and push."
          exit 0
        fi
        git commit -m "Updated Citation Data"
        git push "${remote_repo}" HEAD:google-scholar-stats --force
      env: 
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}